[package]
name = "p2i-todo"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[dependencies]
axum = "=0.8.6"
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread", "net", "signal"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
utoipa = { version = "=5.4.0", features = ["axum_extras"] }

[dev-dependencies]
tower = { version = "=0.5.2", features = ["util"] }
http-body-util = "=0.1.3"
